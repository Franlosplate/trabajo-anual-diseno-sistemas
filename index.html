<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--para tamaño de celulares, de esta forma no se va a ver como en pantalla de net en celular-->
<title>Tanques S.A. - Diseño de Sistemas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <!--cargo los estilos desde bootstrap-->
<link href="estilos.css" rel="stylesheet"> <!--codigos que use para darle mi propio estilo-->
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary sticky-top"> <!--clase que saque de boostrap para mi barra de navegacion-->
  <div class="container-fluid">
    <span class="navbar-brand fw-semibold">Tanques S.A. - Diseño de Sistemas</span>
    <button class="btn btn-outline-light btn-sm d-md-none" data-bs-toggle="offcanvas" data-bs-target="#menuMovil">Menú</button> <!--en celulares aparece boton menu-->
  </div>
  <!--puedo cambiar el color modificando el code bg-primary y dark-->
  <!--stickyy-top lo agregue para mentener el titulo fijo-->
  <!--navbar-brand para agregar el titulo-->
</nav>

<div class="container-fluid"> <!--para ocupar todo el ancho de la pantalla-->
  <div class="row"> <!--grilla de bootstrap para acomodar el menu a la izquierda y el contenido a la derecha-->

    <!-- SIDEBAR (desktop) -->
    <aside class="col-md-3 col-lg-2 p-0 d-none d-md-block sidebar"> <!--para acomodar el tamaño de resolucion para las distintas pantallas de nets-->
      <div class="list-group list-group-flush pt-2" id="menu"></div> <!--para mis botones-->
    </aside>

    <!-- SIDEBAR (móvil) -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="menuMovil">
      <div class="offcanvas-header"><h5 class="offcanvas-title">Secciones</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div>
      <div class="offcanvas-body p-0"><div class="list-group list-group-flush" id="menuMovilLista"></div></div>
      <!--offcanvas: clase de Bootstrap para paneles laterales
          offcanvas-start: lo hace aparecer desde el lado izquierdo
          tabindex="-1": permite que Bootstrap lo controle con el teclado
          id="menuMovil": es el nombre que usa el botón "Menú" del navbar para abrirlo-->
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="col-12 col-md-9 col-lg-10 p-4 content-area" id="app"></main> <!--para resolucion de pantalla-->
  </div>
</div>

<!-- MODAL CREAR / MODIFICAR -->
<div class="modal fade" id="modalForm" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitulo">Formulario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body"><form id="formRegistro" class="row g-3"></form></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" id="btnGuardar">Guardar</button>
      </div>
    </div>
  </div>
  <!--modal: clase de Bootstrap para ventanas emergentes
      fade: hace que aparezca con una transición suave
      id="modalForm": el nombre que usa script.js para abrirla
      tabindex="-1": permite cerrarla con la tecla Esc-->
</div>

<!-- MODAL ELIMINAR -->
<div class="modal fade" id="modalEliminar" tabindex="-1">
  <div class="modal-dialog"> <!--tamaño estandar-->
    <div class="modal-content"> <!--mi caja blanca que contiene el titulos, lo mensajes y botones-->
      <div class="modal-header"><h5 class="modal-title">Eliminar registro</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="textoEliminar"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-danger" id="btnConfirmarEliminar">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<footer class="bg-white border-top d-flex align-items-center justify-content-center small text-muted">
  Franco Frías López · Ingeniería en Sistemas de Información · UTN Regional Trenque Lauquen · Diseño de Sistemas
</footer>
<!--mi pie de pagina-->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!--lo uso para cargar el Javascript de bootstrap desde opera, con esto hago funcionar mis modales, botones y menu para los moviles -->
<script src="script.js"></script> <!--para cargar mi scrit que esta en mi carpeta Trabajo Anual-->
</body>
</html>
